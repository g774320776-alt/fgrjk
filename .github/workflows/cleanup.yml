name: cleanup
on: workflow_dispatch
permissions:
  actions: write
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api --paginate "repos/${{ github.repository }}/actions/runs?per_page=100" -q '.workflow_runs[].id'); do
            [ "$id" = "${{ github.run_id }}" ] || gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" && echo del $id
          done
