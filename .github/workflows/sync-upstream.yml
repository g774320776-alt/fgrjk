name: 自动同步上游仓库
on:
  schedule:
    # UTC20点 = 北京时间04:00
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    name: 同步上游main分支
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步上游FGBLH/fgrjk main分支
        uses: aormsby/fork-sync-with-upstream-action@v3.4.1
        with:
          upstream_sync_repo: FGBLH/fgrjk
          upstream_sync_branch: main
          target_sync_branch: main
          sync_mode: reset
          target_repo_token: ${{ secrets.SYNC_TOKEN }}
          test_mode: false
