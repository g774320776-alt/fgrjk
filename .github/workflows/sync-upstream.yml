name: 自动同步上游仓库

on:
  schedule:
    # 每天北京时间 04:00（UTC 20:00）
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: 同步上游 main 分支
    runs-on: ubuntu-latest

    steps:
      - name: 同步上游 FGBLH/fgrjk
        uses: aormsby/fork-sync-with-upstream-action@v3.4.1
        with:
          upstream_sync_repo: FGBLH/fgrjk
          upstream_sync_branch: main
          target_sync_branch: main
          sync_mode: reset
          target_repo_token: ${{ secrets.SYNC_TOKEN }}
          test_mode: false
