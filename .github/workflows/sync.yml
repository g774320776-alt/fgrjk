name: 定时同步上游仓库
on:
  schedule:
    # UTC20点 = 北京时间次日04:00
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置git信息
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add upstream https://github.com/FGBLH/fgrjk.git

      - name: 拉取上游更新合并
        run: |
          git fetch upstream
          git merge upstream/main --ff-only
          git push origin main

